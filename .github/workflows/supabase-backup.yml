name: Supabase encrypted Staging backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-encrypted-staging-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      disposable-postgres:
        image: supabase/postgres:17.11.0.007@sha256:b0463b9ab930a3535478d529b915d37def49d5a8fb0cb1927929e96af992b519
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: restore-validation-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main only."
            exit 1
          fi
          if [[ -z "$SUPABASE_DB_URL" || -z "$BACKUP_ENCRYPTION_KEY" ]]; then
            echo "::error::Add SUPABASE_DB_URL and BACKUP_ENCRYPTION_KEY in GitHub Actions secrets."
            exit 1
          fi
          node scripts/validateStagingBackupTarget.mjs
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Create, encrypt, and restore database dump
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          dump="${RUNNER_TEMP}/supabase-staging-${GITHUB_RUN_ID}.dump"
          encrypted="${RUNNER_TEMP}/supabase-staging-${GITHUB_RUN_ID}.aeb"
          encrypted_restore="${RUNNER_TEMP}/supabase-staging-${GITHUB_RUN_ID}-encrypted-restore.dump"
          restore_db="backup_restore_validation"
          encrypted_restore_db="backup_encrypted_restore_validation"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-acl --file "$dump" "$SUPABASE_DB_URL"
          test -s "$dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "$dump" > /dev/null
          PGPASSWORD=restore-validation-only /usr/lib/postgresql/17/bin/createdb \
            --host 127.0.0.1 --username supabase_admin "$restore_db"
          PGPASSWORD=restore-validation-only /usr/lib/postgresql/17/bin/pg_restore \
            --exit-on-error --no-owner --no-acl \
            --host 127.0.0.1 --username supabase_admin --dbname "$restore_db" "$dump"
          table_count=$(PGPASSWORD=restore-validation-only /usr/lib/postgresql/17/bin/psql \
            --host 127.0.0.1 --username supabase_admin --dbname "$restore_db" \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema')")
          if (( table_count < 1 )); then
            echo "::error::Disposable restore completed without any user tables."
            exit 1
          fi
          echo "Disposable dump restore validated ($table_count user tables)."
          node scripts/encryptedBackup.mjs encrypt "$dump" "$encrypted"
          test -s "$encrypted"
          size=$(stat --format=%s "$encrypted")
          max_size=$((400 * 1024 * 1024))
          if (( size > max_size )); then
            echo "::error::Encrypted backup exceeds the 400 MiB free-storage safety cap."
            exit 1
          fi
          node scripts/encryptedBackup.mjs decrypt "$encrypted" "$encrypted_restore"
          test -s "$encrypted_restore"
          /usr/lib/postgresql/17/bin/pg_restore --list "$encrypted_restore" > /dev/null
          PGPASSWORD=restore-validation-only /usr/lib/postgresql/17/bin/createdb \
            --host 127.0.0.1 --username supabase_admin "$encrypted_restore_db"
          PGPASSWORD=restore-validation-only /usr/lib/postgresql/17/bin/pg_restore \
            --exit-on-error --no-owner --no-acl \
            --host 127.0.0.1 --username supabase_admin --dbname "$encrypted_restore_db" "$encrypted_restore"
          encrypted_table_count=$(PGPASSWORD=restore-validation-only /usr/lib/postgresql/17/bin/psql \
            --host 127.0.0.1 --username supabase_admin --dbname "$encrypted_restore_db" \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema')")
          if (( encrypted_table_count != table_count )); then
            echo "::error::Encrypted backup restore table count does not match the source dump restore."
            exit 1
          fi
          echo "Encrypted artifact round-trip restore validated ($encrypted_table_count user tables)."
          echo "BACKUP_PATH=$encrypted" >> "$GITHUB_ENV"
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/supabase-staging-${{ github.run_id }}.aeb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove temporary database files
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/supabase-staging-${GITHUB_RUN_ID}.dump" \
            "${RUNNER_TEMP}/supabase-staging-${GITHUB_RUN_ID}.aeb" \
            "${RUNNER_TEMP}/supabase-staging-${GITHUB_RUN_ID}-encrypted-restore.dump"
