name: Supabase encrypted backup

on:
  schedule:
    - cron: '33 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL BACKUP_ENCRYPTION_KEY R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret or variable is missing: ${name}"
              exit 1
            fi
          done
          if [[ ! "$R2_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID must be a 32-character Cloudflare account ID."
            exit 1
          fi
          if [[ ! "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::R2_BACKUP_BUCKET must be a valid lowercase bucket name."
            exit 1
          fi
          if [[ ! "$SUPABASE_DB_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URL."
            exit 1
          fi
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create and encrypt database dump
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          dump="${RUNNER_TEMP}/supabase-${GITHUB_RUN_ID}.dump"
          encrypted="${RUNNER_TEMP}/supabase-${GITHUB_RUN_ID}.aeb"
          trap 'rm -f "$dump"' EXIT
          pg_dump --format=custom --no-owner --no-acl --file "$dump" "$SUPABASE_DB_URL"
          node scripts/encryptedBackup.mjs encrypt "$dump" "$encrypted"
          echo "BACKUP_FILE=$encrypted" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=supabase-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.aeb" >> "$GITHUB_ENV"
      - name: Upload encrypted backup to Cloudflare R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          trap 'rm -f "$BACKUP_FILE"' EXIT
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET}/daily/${BACKUP_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --only-show-errors
