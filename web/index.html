<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172554" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Ruang kerja sekolah untuk data, perencanaan ajar, program BK dan kegiatan, asesmen, komunikasi, serta integrasi pilihan. Aktivasi bergantung pada kesiapan backend." />
    <meta name="format-detection" content="telephone=no" />
    <title>AI_nnoe · Learning Ecosystem</title>

    <!-- ============================================================
         FAVICON — infinity ALE, transparan, gradien teal.
         Urutan penting: SVG dulu (progressive), lalu PNG fallback.
         ============================================================ -->

    <!-- 1. SVG eksternal (utama, semua browser modern) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 2. SVG inline data URI (cadangan bila /favicon.svg tidak termuat) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='32' x2='64' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%231e1b4b'/%3E%3Cstop offset='0.4' stop-color='%233730a3'/%3E%3Cstop offset='0.75' stop-color='%230f766e'/%3E%3Cstop offset='1' stop-color='%2314b8a6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 32 C24.5 20 12 20 12 32 C12 44 24.5 44 32 32 C39.5 20 52 20 52 32 C52 44 39.5 44 32 32' fill='none' stroke='url(%23g)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- 3. iOS home screen (butuh PNG 180×180 dengan latar solid) -->
    <link rel="apple-touch-icon" sizes="256x256" href="/logo-ale.png" />

    <!-- 4. PWA manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 5. Safari pinned tab (mask monokrom) -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#3730a3" />

    <!-- 6. Metadata aplikasi -->
    <meta name="application-name" content="AINNOE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AINNOE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- 7. Open Graph (share preview WhatsApp / Slack / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ainnoe Learning Ecosystem" />
    <meta property="og:description" content="Ruang kerja sekolah untuk data, perencanaan ajar, program BK dan kegiatan, asesmen, komunikasi, serta integrasi pilihan. Aktivasi bergantung pada kesiapan backend." />
    <meta property="og:image" content="/logo-ale-lockup.png" />

    <!-- 8. Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ainnoe Learning Ecosystem" />
    <meta name="twitter:description" content="Ruang kerja sekolah untuk data, perencanaan ajar, program BK dan kegiatan, asesmen, komunikasi, serta integrasi pilihan. Aktivasi bergantung pada kesiapan backend." />
    <meta name="twitter:image" content="/logo-ale-lockup.png" />

    <!-- Bootstrap Icons — dipakai ui.js untuk seluruh ikon menu & UI.
         Preconnect agar font woff2 siap lebih awal; crossorigin wajib untuk fonts.gstatic.com. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tipografi: Plus Jakarta Sans (fallback ke system-ui bila gagal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />

    <!-- Splash: tampil seketika, sebelum JS aplikasi selesai dimuat -->
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <noscript>
      <div class="noscript-message">
        <h1>Ainnoe</h1>
        <p>
          Ainnoe membutuhkan JavaScript untuk berjalan.
          Aktifkan JavaScript di peramban Anda, lalu muat ulang halaman ini.
        </p>
      </div>
    </noscript>

    <div id="app" aria-live="polite">
      <div class="splash" id="splash" role="status">
        <img
          class="splash__logo"
          src="/logo-ale-lockup-1x.png"
          srcset="/logo-ale-lockup-2x.png 2x"
          alt=""
          width="112"
          height="88"
        />
        <div class="splash__spin" aria-hidden="true"></div>
        <p class="splash__pesan">Menyiapkan Ainnoe…</p>
        <button type="button" class="splash__muat" id="splashMuatUlang">Muat ulang</button>
      </div>
    </div>

    <script defer src="/splash.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
